CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

CONFIG_ZMK_BATTERY_REPORT_INTERVAL=30
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y

CONFIG_ZMK_USB_BOOT=y
CONFIG_ZMK_POINTING=y

# Encoder support
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# increase the idle timeout to 90 seconds (default is 30 seconds)
# this will reduce the trackpad active to idle to active cycle 
# when using an external mouse. This may drain battery faster than desired
# decided to make this universal
CONFIG_ZMK_IDLE_TIMEOUT=60000



# -------------------------
# ZMK Arbitrary Split Data Channel Settings
# -------------------------

# L2CAP MTU configuration - set to at least your packet size
CONFIG_BT_L2CAP_TX_MTU=128

# ACL buffer sizes - must be >= L2CAP_TX_MTU + L2CAP overhead (~4-8 bytes)
CONFIG_BT_BUF_ACL_TX_SIZE=136
CONFIG_BT_BUF_ACL_RX_SIZE=136

# Controller data length extension (251 is max for BLE, fragmentation handles larger)
CONFIG_BT_CTLR_DATA_LENGTH_MAX=136

CONFIG_BT_L2CAP_DYNAMIC_CHANNEL=y

# Increase overall buffer counts
CONFIG_BT_BUF_ACL_RX_COUNT=8
CONFIG_BT_BUF_ACL_TX_COUNT=8

# L2CAP TX buffer count for dynamic channels
CONFIG_BT_L2CAP_TX_BUF_COUNT=30
