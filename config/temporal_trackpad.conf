CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y

# -------------------------
# Azoteq Touchpad Configuration
#
# IMPORTANT: Only enable the display --OR-- the Touchpad
#    You cannot use SPI (display) and I2C (touchpad)
#    on the same instance (e.g. spi0 and i2c0)
#
# NOTE: this trackpad is on the right half
# -------------------------
CONFIG_I2C=y
CONFIG_INPUT=y
CONFIG_INPUT_TPS43=y
CONFIG_INPUT_THREAD_STACK_SIZE=2048