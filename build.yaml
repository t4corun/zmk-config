# This file generates the GitHub Actions matrix.
# For simple board + shield combinations, add them to the top level board and
# shield arrays, for more control, add individual board + shield combinations
# to the `include` property. You can also use the `cmake-args` property to
# pass flags to the build command, `snippet` to add a Zephyr snippet, and
# `artifact-name` to assign a name to distinguish build outputs from each other:
#
# board: [ "nice_nano_v2" ]
# shield: [ "corne_left", "corne_right" ]
# include:
#   - board: bdn9_rev2
#   - board: nice_nano_v2
#     shield: reviung41
#   - board: nice_nano_v2
#     shield: corne_left
#     snippet: studio-rpc-usb-uart
#     cmake-args: -DCONFIG_ZMK_STUDIO=y
#     artifact-name: corne_left_with_studio
#
---
include:
  # -------------------------
  # TOTEM
  # -------------------------
  - board: xiao_ble//zmk
    shield: totem_prospector prospector_adapter
    artifact-name: totem_prospector

  - board: xiao_ble//zmk
    shield: totem_dongle rgbled_adapter
    artifact-name: totem_dongle

  - board: xiao_ble//zmk
    shield: totem_left
    artifact-name: totem_left

  - board: xiao_ble//zmk
    shield: totem_right
    artifact-name: totem_right


  # -------------------------
  # Temporal Dongle (RGB and split data channel)
  # -------------------------
  - board: xiao_ble//zmk
    shield: temporal_dongle rgbled_adapter
    artifact-name: temporal_dongle
  - board: nice_nano//zmk
    shield: temporal_dongleleft nice_view_battery_peripheral
    artifact-name: temporal_dongle_left
  - board: nice_nano//zmk
    shield: temporal_dongleright nice_view_battery_peripheral
    artifact-name: temporal_dongle_right


  # -------------------------
  # Temporal Prospector (prospector screen and trackpad)
  # -------------------------
  - board: xiao_ble//zmk
    shield: temporal_prospector prospector_adapter
    artifact-name: temporal_prospector
  - board: nice_nano//zmk
    shield: temporal_prospectorleft nice_view
    artifact-name: temporal_prospector_left
  - board: nice_nano//zmk
    shield: temporal_prospectorright
#    snippet: zmk-usb-logging
    artifact-name: temporal_prospector_right


  # -------------------------
  # Settings Reset
  # -------------------------
  - board: xiao_ble//zmk
    shield: settings_reset
    artifact-name: xiao_settings_reset
  - board: nice_nano//zmk
    shield: settings_reset
    artifact-name: nice_nano_settings_reset
